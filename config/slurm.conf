ClusterName=compose-lab
SlurmctldHost=controller
SlurmUser=slurm
AuthType=auth/munge
CredType=cred/munge
StateSaveLocation=/var/lib/slurm/ctld
SlurmdSpoolDir=/var/lib/slurm/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
TaskPluginParam=SlurmdOffSpec,Threads,OOMKillStep
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=5
PrologFlags=Contain
GresTypes=gpu
MpiDefault=pmix
ReturnToService=2
SlurmdTimeout=60
SlurmctldTimeout=60
MinJobAge=3600
KillWait=3
Waittime=0
CompleteWait=0
MessageTimeout=30
SlurmctldParameters=kill_invalid_depend
# Slurm abstract CPU IDs are core-major: OS (0,8) -> abstract (0,1).
# Preserve real host topology; reserve every CPU outside each Docker cpuset.
NodeName=DEFAULT CPUs=16 Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=2 State=UNKNOWN
NodeName=cpu01 RealMemory=7168 CpuSpecList=4-15
NodeName=cpu02 RealMemory=7168 CpuSpecList=0-3,8-15
NodeName=gpu01 RealMemory=14336 CpuSpecList=0-7,12-15 Gres=gpu:1
PartitionName=cpu Nodes=cpu01,cpu02 Default=YES MaxTime=00:30:00 DefaultTime=00:05:00 DefMemPerCPU=512 State=UP
PartitionName=gpu Nodes=gpu01 Default=NO MaxTime=00:30:00 DefaultTime=00:05:00 DefMemPerCPU=512 State=UP
