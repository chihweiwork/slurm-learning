# Template without credentials; lab-boot appends StoragePass from the
# accounting-secret volume and writes /etc/slurm/slurmdbd.conf (0600 slurm).
AuthType=auth/munge
DbdHost=slurmdbd
DbdPort=6819
SlurmUser=slurm
PidFile=/run/slurmdbd.pid
DebugLevel=info
StorageType=accounting_storage/mysql
StorageHost=mariadb
StoragePort=3306
StorageUser=slurm
StorageLoc=slurm_acct_db
