# Node-local paths avoid cross-node rootfs/cache races on /shared.
ENROOT_RUNTIME_PATH /run/enroot/${UID}
ENROOT_CACHE_PATH /var/cache/enroot/${UID}
ENROOT_DATA_PATH /var/lib/enroot/${UID}
ENROOT_TEMP_PATH /tmp
ENROOT_MAX_PROCESSORS 2
ENROOT_REMAP_ROOT no
ENROOT_ROOTFS_WRITABLE no
ENROOT_MOUNT_HOME no
# Enroot changes namespace views, but tasks inherit Slurm resource restrictions.
ENROOT_RESTRICT_DEV yes
